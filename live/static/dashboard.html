<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N13 Live Monitor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --surface: #14181d;
      --surface-2: #1b2026;
      --line: #303740;
      --text: #f2f4f7;
      --muted: #9da7b3;
      --green: #3ddc97;
      --red: #ff6470;
      --amber: #f2bd52;
      --cyan: #58c7dc;
      --blue: #7399ff;
      --radius: 6px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .mode-banner {
      position: sticky; top: 0; z-index: 20; min-height: 34px; padding: 8px 20px;
      background: #7a2f36; border-bottom: 1px solid #ad4650; color: #fff;
      font-weight: 800; letter-spacing: 0; text-align: center;
    }
    .mode-banner.live { background: #174b3b; border-color: #28775f; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: #101318;
    }
    .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .brand h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .brand span { color: var(--muted); white-space: nowrap; }
    .config-toggle, .save-button {
      border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
      padding: 8px 12px; border-radius: var(--radius); font-weight: 700;
    }
    .config-toggle:hover, .save-button:hover { border-color: var(--cyan); }
    main { max-width: 1540px; margin: 0 auto; padding: 18px 24px 40px; }
    section { margin-bottom: 26px; }
    .section-heading {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 10px;
    }
    .section-heading h2 { margin: 0; font-size: 15px; text-transform: uppercase; color: #cdd3da; letter-spacing: .04em; }
    .section-heading small { color: var(--muted); }
    .watch-list {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px;
    }
    .watch-game {
      width: 100%; min-height: 112px; padding: 12px; border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--surface); color: var(--text); text-align: left;
    }
    .watch-game:hover, .watch-game.selected { border-color: var(--cyan); background: #172027; }
    .watch-game.triggered { border-left: 4px solid var(--amber); }
    .watch-top, .team-row, .metric-row, .panel-head, .config-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .watch-top { margin-bottom: 10px; }
    .team-row { min-height: 27px; font-size: 15px; }
    .team-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .favorite-mark { color: var(--amber); font-size: 11px; font-weight: 800; }
    .score { font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 800; }
    .chip {
      display: inline-flex; align-items: center; min-height: 22px; padding: 3px 7px;
      border: 1px solid var(--line); border-radius: 999px; color: #d5d9de;
      font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap;
    }
    .chip.triggered, .chip.thin { border-color: #8f6b24; color: var(--amber); }
    .chip.reliable, .chip.ok { border-color: #237554; color: var(--green); }
    .chip.unreliable, .chip.error, .chip.no-market { border-color: #9f3f49; color: var(--red); }
    .chip.tier { color: var(--cyan); border-color: #276b78; }
    .subtle { color: var(--muted); }
    .empty {
      min-height: 150px; display: grid; place-items: center; border: 1px dashed var(--line);
      color: var(--muted); border-radius: var(--radius); background: #101318;
    }
    .detail { border-top: 1px solid var(--line); padding-top: 18px; }
    .scoreboard {
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 18px;
      align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line);
    }
    .score-team { min-width: 0; }
    .score-team:last-child { text-align: right; }
    .score-team strong { display: block; font-size: clamp(21px, 3vw, 34px); overflow-wrap: anywhere; }
    .score-team .big-score { font-size: clamp(34px, 5vw, 54px); font-weight: 900; font-variant-numeric: tabular-nums; }
    .game-clock { text-align: center; min-width: 110px; }
    .game-clock strong { display: block; font-size: 20px; }
    .detail-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; margin-top: 18px; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; min-width: 0; }
    .panel h3 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
    .panel-head { padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 13px; }
    .primary-prob { display: flex; align-items: end; gap: 14px; margin: 10px 0 14px; }
    .primary-prob strong { font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
    .primary-prob span { color: var(--muted); padding-bottom: 5px; }
    .metric-row { padding: 8px 0; border-bottom: 1px solid #252b32; }
    .metric-row:last-child { border-bottom: 0; }
    .metric-label { color: #c8ced5; }
    .metric-value { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
    .context-block { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .context-block h4 { margin: 0 0 8px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .band-wrap { margin: 14px 0 10px; }
    .band-scale { position: relative; height: 28px; background: #242a31; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .band-range { position: absolute; top: 5px; height: 16px; background: rgba(88,199,220,.34); border: 1px solid var(--cyan); }
    .band-point { position: absolute; top: 1px; width: 3px; height: 24px; background: #fff; }
    .band-labels { display: flex; justify-content: space-between; color: var(--muted); margin-top: 5px; font-size: 11px; }
    .warning {
      padding: 10px 12px; margin: 10px 0; border: 1px solid #9f3f49; border-radius: 4px;
      background: #2a171b; color: #ffb5bb; font-weight: 750;
    }
    .warning.amber { border-color: #8f6b24; background: #282113; color: #f8d88f; }
    .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .market-venue { border-left: 3px solid var(--line); padding-left: 12px; min-width: 0; }
    .market-venue.best { border-left-color: var(--green); }
    .market-title { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-weight: 850; text-transform: capitalize; }
    .gap-number { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .risk-panel { grid-column: 1 / -1; }
    .risk-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .risk-cell { background: var(--surface); padding: 14px; min-height: 145px; }
    .risk-cell h4 { margin: 0 0 12px; color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
    .risk-hero { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .streak-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .streak-table td { padding: 3px 0; border: 0; }
    .streak-table td:last-child { text-align: right; }
    .config-panel { display: none; padding: 14px 24px; border-bottom: 1px solid var(--line); background: #11161b; }
    .config-panel.open { display: block; }
    .config-grid { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)) auto; gap: 10px; align-items: end; max-width: 1400px; margin: auto; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    input { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--text); padding: 8px; }
    .trigger-list { border-top: 1px solid var(--line); }
    .trigger-row { display: grid; grid-template-columns: 160px 1fr 80px 100px 80px 1fr; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #252b32; align-items: center; }
    .trigger-row strong { overflow-wrap: anywhere; }
    .fatal { color: var(--red); padding: 30px; font-weight: 800; }
    @media (max-width: 980px) {
      header { align-items: flex-start; }
      .brand { display: block; }
      .brand span { display: block; margin-top: 3px; }
      .detail-grid { grid-template-columns: 1fr; }
      .risk-grid { grid-template-columns: 1fr 1fr; }
      .config-grid { grid-template-columns: 1fr 1fr; }
      .market-grid { grid-template-columns: 1fr; }
      .trigger-row { grid-template-columns: 120px 1fr 60px 80px; }
      .trigger-row > :nth-child(5), .trigger-row > :nth-child(6) { display: none; }
    }
    @media (max-width: 620px) {
      main { padding: 14px 12px 30px; }
      header { padding: 14px 12px; }
      .mode-banner { padding-inline: 10px; }
      .watch-list { grid-template-columns: 1fr; }
      .scoreboard { grid-template-columns: 1fr; gap: 8px; }
      .score-team, .score-team:last-child, .game-clock { text-align: center; }
      .risk-grid, .config-grid { grid-template-columns: 1fr; }
      .primary-prob strong { font-size: 40px; }
    }
  </style>
</head>
<body>
  <div id="modeBanner" class="mode-banner">STUB MODE — replayed data, not live</div>
  <header>
    <div class="brand"><h1>N13 Live Monitor</h1><span>favorite deficit watch</span></div>
    <button id="configToggle" class="config-toggle" type="button">Risk settings</button>
  </header>
  <div id="configPanel" class="config-panel">
    <form id="configForm" class="config-grid">
      <label>Bankroll ($)<input name="bankroll" type="number" min="1" step="1"></label>
      <label>Kelly fraction<input name="kelly_fraction" type="number" min="0" max="1" step="0.05"></label>
      <label>Max stake fraction<input name="max_bankroll_fraction_per_bet" type="number" min="0" max="1" step="0.01"></label>
      <label>Ruin comfort<input name="ruin_comfort_threshold" type="number" min="0" max="1" step="0.01"></label>
      <label>Drawdown floor<input name="drawdown_floor" type="number" min="0" max="0.99" step="0.05"></label>
      <button class="save-button" type="submit">Save locally</button>
    </form>
  </div>
  <main>
    <section>
      <div class="section-heading"><h2>Watch List</h2><small id="refreshState">Waiting for state</small></div>
      <div id="watchList" class="watch-list"><div class="empty">No monitored games</div></div>
    </section>
    <section id="detailSection" class="detail">
      <div id="gameDetail" class="empty">Select a monitored game</div>
    </section>
    <section>
      <div class="section-heading"><h2>Recent Triggers</h2><small>session scrollback</small></div>
      <div id="triggerList" class="trigger-list"><div class="empty">No triggers recorded</div></div>
    </section>
  </main>
  <script>
    const ui = { state: null, config: null, triggers: [], triggerSnapshots: [], selectedGameId: null, selectedSnapshot: null };
    const $ = (id) => document.getElementById(id);
    const pct = (value, digits=1) => value == null ? "—" : `${(Number(value) * 100).toFixed(digits)}%`;
    const money = (value) => value == null ? "—" : new Intl.NumberFormat("en-US", {style:"currency", currency:"USD", maximumFractionDigits:2}).format(value);
    const num = (value, digits=2) => value == null ? "—" : Number(value).toFixed(digits);
    const safe = (value) => String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const reliabilityChip = (flag) => `<span class="chip ${safe(flag || "unreliable")}">${safe(flag || "unknown")}</span>`;

    function statusChip(status) {
      const normalized = String(status || "MONITORING").toLowerCase().replace("_", "-");
      return `<span class="chip ${normalized}">${safe(status)}</span>`;
    }

    async function fetchJSON(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
      return response.json();
    }

    async function refresh() {
      try {
        const [state, config, triggers] = await Promise.all([
          fetchJSON("/api/state"), fetchJSON("/api/config"), fetchJSON("/api/triggers?limit=100")
        ]);
        ui.state = state; ui.config = config; ui.triggers = triggers.triggers; ui.triggerSnapshots = triggers.snapshots || [];
        if (!ui.selectedGameId || !state.games.some(g => g.game_id === ui.selectedGameId)) {
          const triggered = state.games.find(g => g.status === "TRIGGERED");
          ui.selectedGameId = (triggered || state.games[0] || {}).game_id || null;
        }
        render();
      } catch (error) {
        $("refreshState").textContent = "Dashboard API unavailable";
        $("gameDetail").innerHTML = `<div class="fatal">${safe(error.message)}</div>`;
      }
    }

    function render() {
      renderMode(); renderConfig(); renderWatchList(); renderDetail(); renderTriggers();
      $("refreshState").textContent = `Updated ${new Date().toLocaleTimeString()} · ${ui.state.game_count} games`;
    }

    function renderMode() {
      const live = ui.state.mode === "live";
      $("modeBanner").className = `mode-banner${live ? " live" : ""}`;
      $("modeBanner").textContent = live ? "LIVE MODE — public prices and paid CFBD feed" : "STUB MODE — replayed data, not live";
    }

    function renderConfig() {
      if (!ui.config) return;
      for (const [key, value] of Object.entries(ui.config)) {
        const input = document.querySelector(`[name="${key}"]`);
        if (input && document.activeElement !== input) input.value = value;
      }
    }

    function renderWatchList() {
      const games = [...ui.state.games].sort((a,b) => (b.status === "TRIGGERED") - (a.status === "TRIGGERED"));
      if (!games.length) { $("watchList").innerHTML = `<div class="empty">No games are currently on the watch list</div>`; return; }
      $("watchList").innerHTML = games.map(game => {
        const state = game.state || {};
        const favRank = game.favorite_ap_rank ? `<span class="subtle">#${game.favorite_ap_rank}</span> ` : "";
        return `<button class="watch-game ${game.status === "TRIGGERED" ? "triggered" : ""} ${ui.selectedGameId === game.game_id ? "selected" : ""}" data-game="${safe(game.game_id)}" type="button">
          <div class="watch-top"><span class="subtle">Q${safe(state.period || "—")} ${safe(state.clock || "—")}</span>${statusChip(game.status)}</div>
          <div class="team-row"><span class="team-name">${favRank}${safe(game.favorite)} <span class="favorite-mark">FAV</span></span><span class="score">${safe(game.favorite_score ?? "—")}</span></div>
          <div class="team-row"><span class="team-name">${safe(game.dog)}</span><span class="score">${safe(game.dog_score ?? "—")}</span></div>
          <div class="watch-top"><span class="subtle">Spread ${num(game.pregame_spread,1)}</span><span class="subtle">Deficit ${game.deficit == null ? "—" : safe(game.deficit)}</span></div>
        </button>`;
      }).join("");
      document.querySelectorAll("[data-game]").forEach(button => button.addEventListener("click", () => {
        ui.selectedGameId = button.dataset.game; ui.selectedSnapshot = null; renderWatchList(); renderDetail();
      }));
    }

    function renderDetail() {
      const game = ui.selectedSnapshot || ui.state.games.find(g => g.game_id === ui.selectedGameId);
      if (!game) { $("gameDetail").className = "empty"; $("gameDetail").innerHTML = "Select a monitored game"; return; }
      $("gameDetail").className = "";
      const state = game.state || {};
      $("gameDetail").innerHTML = `
        <div class="section-heading"><h2>Game Detail</h2>${statusChip(game.status)}</div>
        <div class="scoreboard">
          <div class="score-team"><span class="subtle">Favorite · ${num(game.pregame_spread,1)}</span><strong>${safe(game.favorite)}</strong><span class="big-score">${safe(game.favorite_score ?? "—")}</span></div>
          <div class="game-clock"><span class="subtle">${safe(state.status || "not started")}</span><strong>Q${safe(state.period || "—")} ${safe(state.clock || "—")}</strong><span class="subtle">Possession: ${safe(state.possession || "unknown")}</span></div>
          <div class="score-team"><span class="subtle">Opponent</span><strong>${safe(game.dog)}</strong><span class="big-score">${safe(game.dog_score ?? "—")}</span></div>
        </div>
        <div class="detail-grid">
          ${enginePanel(game)}
          ${marketPanel(game)}
          ${gapPanel(game)}
          ${riskPanel(game)}
        </div>`;
    }

    function enginePanel(game) {
      const scoring = game.scoring;
      if (!scoring) return `<article class="panel"><div class="panel-head"><h3>The Engine's Read</h3><span class="chip unreliable">waiting</span></div><div class="empty">No trigger estimate yet</div></article>`;
      const finalWin = scoring.tier_1.favorite_final_win;
      const erased = scoring.tier_1.deficit_erased;
      const tier3 = scoring.tier_3;
      const conditional = findEstimate(scoring, "conditional_rate_full", "favorite_final_win");
      const ranking = findEstimate(scoring, "ranking_rate", "favorite_final_win");
      const historicalMarket = findEstimate(scoring, "market_no_vig_historical", "favorite_final_win");
      const disagreement = tier3 ? Math.abs(tier3.calibrated_prob - erased.value) : 0;
      return `<article class="panel">
        <div class="panel-head"><h3>The Engine's Read</h3><span class="chip tier" title="${safe(scoring.tier_reasons[`tier_${scoring.tier_used}`])}">Tier ${scoring.tier_used}</span></div>
        <div class="primary-prob"><strong>${pct(finalWin.value)}</strong><span>Favorite final-win probability</span></div>
        <div class="metric-row"><span class="metric-label">Evidence</span><span class="metric-value">${safe(finalWin.n_events)} events · ${safe(finalWin.n_games)} games · ${safe(finalWin.n_seasons)} seasons</span></div>
        <div class="metric-row"><span class="metric-label">Reliability</span>${reliabilityChip(finalWin.reliability_flag)}</div>
        <div class="metric-row"><span class="metric-label">Probability deficit is erased</span><span class="metric-value">${pct(erased.value)}</span></div>
        <div class="warning amber">These are different outcomes: erasing the deficit does not mean winning the game.</div>
        <div class="context-block"><h4>Historical descriptive · Tier 2</h4>
          ${estimateRow("Conditional final-win rate", conditional)}
          ${estimateRow("AP-ranking final-win rate", ranking)}
          ${estimateRow("What pregame markets historically charged", historicalMarket)}
        </div>
        <div class="context-block"><h4>Tier 3 · deficit-erased model</h4>
          ${tier3 ? conformalBand(tier3) : `<div class="warning amber">${safe(scoring.tier_3_unavailable_reason || "Tier 3 unavailable")}</div>`}
          ${tier3 && disagreement > .10 ? `<div class="warning">LABEL-MATCHED DISAGREEMENT: Tier 1 deficit-erased ${pct(erased.value)} vs Tier 3 ${pct(tier3.calibrated_prob)}.</div>` : ""}
        </div>
      </article>`;
    }

    function findEstimate(scoring, metric, label) {
      return (scoring.tier_2?.[metric] || []).find(row => row.label === label) || null;
    }

    function estimateRow(label, row) {
      if (!row) return `<div class="metric-row"><span class="metric-label">${safe(label)}</span><span class="subtle">unavailable</span></div>`;
      return `<div class="metric-row"><span class="metric-label">${safe(label)}</span><span class="metric-value">${pct(row.value)} · n=${safe(row.n_events)} ${reliabilityChip(row.reliability_flag)}</span></div>`;
    }

    function conformalBand(tier3) {
      const left = Math.max(0, tier3.conformal_lower) * 100;
      const width = Math.max(0, tier3.conformal_upper - tier3.conformal_lower) * 100;
      const point = tier3.calibrated_prob * 100;
      return `<div class="metric-row"><span class="metric-label">Probability deficit is erased</span><span class="metric-value">${pct(tier3.calibrated_prob)}</span></div>
        <div class="band-wrap"><div class="band-scale" aria-label="Conformal interval from ${pct(tier3.conformal_lower)} to ${pct(tier3.conformal_upper)}">
          <div class="band-range" style="left:${left}%;width:${width}%"></div><div class="band-point" style="left:${point}%"></div>
        </div><div class="band-labels"><span>${pct(tier3.conformal_lower)}</span><span>95% split-conformal band · q-hat ${num(tier3.conformal_q_hat,3)}</span><span>${pct(tier3.conformal_upper)}</span></div></div>`;
    }

    function marketPanel(game) {
      const market = game.market || {status:"NO_MARKET", quotes:{}, errors:{}};
      const venues = ["kalshi", "polymarket"];
      return `<article class="panel"><div class="panel-head"><h3>Market Lines</h3>${statusChip(market.status)}</div>
        <div class="market-grid">${venues.map(venue => {
          const quote = market.quotes?.[venue]; const error = market.errors?.[venue];
          if (!quote) return `<div class="market-venue"><div class="market-title"><span>${venue}</span><span class="chip no-market">${error ? "error" : "no market"}</span></div><div class="subtle">${safe(error || "No confidently mapped market")}</div></div>`;
          const depth = (quote.depth_top_levels || []).reduce((sum,row) => sum + Number(row.ask_size || 0), 0);
          return `<div class="market-venue ${market.best_venue === venue ? "best" : ""}"><div class="market-title"><span>${venue}</span>${market.best_venue === venue ? '<span class="chip ok">best gap</span>' : ""}</div>
            <div class="metric-row"><span>Bid / ask / mid</span><strong>${pct(quote.best_bid)} / ${pct(quote.best_ask)} / ${pct(quote.mid)}</strong></div>
            <div class="metric-row"><span>Raw · what you pay</span><strong>${pct(quote.implied_prob_raw)}</strong></div>
            <div class="metric-row"><span>No-vig · market belief</span><strong>${pct(quote.implied_prob_no_vig)}</strong></div>
            <div class="metric-row"><span>Spread</span><strong>${pct(quote.spread,2)}</strong></div>
            <div class="metric-row"><span>Top ask depth</span><strong>${num(depth,1)}</strong></div>
            <div class="metric-row"><span>Freshness</span><span class="chip ${quote.is_stale ? "error" : "ok"}">${quote.is_stale ? "stale" : "fresh"}</span></div>
          </div>`;
        }).join("")}</div></article>`;
    }

    function gapPanel(game) {
      const venues = game.risk?.venues || {};
      const reads = Object.entries(venues).filter(([,read]) => read.status === "OK");
      return `<article class="panel"><div class="panel-head"><h3>The Gap</h3><span class="subtle">Tier 1 final-win − live no-vig</span></div>
        ${reads.length ? reads.map(([venue,read]) => `<div class="context-block"><div class="market-title"><span>${safe(venue)}</span><span class="gap-number ${read.gap_no_vig > 0 ? "positive" : "negative"}">${read.gap_no_vig >= 0 ? "+" : ""}${pct(read.gap_no_vig)}</span></div>
          <div class="metric-row"><span>Bid-ask spread</span><strong>${pct(read.spread,2)}</strong></div>
          ${read.survives_friction ? '<div class="chip reliable">gap exceeds spread</div>' : '<div class="warning">DOES NOT SURVIVE FRICTION — spread is as large as or larger than the gap.</div>'}
        </div>`).join("") : `<div class="empty">No fresh market quote; engine estimate remains available</div>`}
      </article>`;
    }

    function riskPanel(game) {
      const risk = game.risk || {}; const venues = risk.venues || {};
      const preferred = game.market?.best_venue;
      const entry = (preferred && venues[preferred]?.status === "OK") ? [preferred, venues[preferred]] : Object.entries(venues).find(([,read]) => read.status === "OK");
      if (!entry) return `<article class="panel risk-panel"><div class="panel-head"><h3>Risk & Variance</h3><span class="chip no-market">no price</span></div><div class="warning amber">${safe(risk.notice || "A real offered price is required for EV and sizing.")}</div></article>`;
      const [venue, read] = entry;
      const lossMajority = read.engine_probability < .5 ? "At this estimate, losses are more likely than wins even if the edge is real." : "Losing streaks remain plausible even with a win probability above 50%.";
      return `<article class="panel risk-panel"><div class="panel-head"><h3>Risk & Variance · ${safe(venue)}</h3><span class="chip ${read.positive_ev ? "reliable" : "error"}">${read.positive_ev ? "positive point EV" : "no edge"}</span></div>
        <div class="warning amber">${safe(risk.notice)}</div>
        ${!read.positive_ev ? '<div class="warning">DO NOT BET — expected value is zero or negative at the raw offered price.</div>' : ""}
        ${read.favorite_longshot_bias_note ? '<div class="warning amber">EXTREME-LOW PRICE: prediction markets exhibit favorite-longshot bias near price extremes; true win probability may be below the quoted implied probability. Informational only.</div>' : ""}
        <div class="risk-grid">
          <div class="risk-cell"><h4>Expected Value</h4><div class="risk-hero ${read.ev_per_dollar > 0 ? "positive" : "negative"}">${read.ev_per_dollar >= 0 ? "+" : ""}${pct(read.ev_per_dollar)}</div><p class="subtle">Per dollar at the raw ${pct(1/read.decimal_odds)} offer. No conformal lower-bound EV exists for this label.</p></div>
          <div class="risk-cell"><h4>Sizing Suggestion</h4><div class="risk-hero">${money(read.suggested_dollars)}</div><p>${pct(read.suggested_fraction)} of bankroll · full Kelly ${pct(read.full_kelly_fraction)}</p><p class="subtle" title="${safe(read.sizing_formula)}">${pct(ui.config?.kelly_fraction ?? 0.25, 0)} Kelly × reliability ${num(read.reliability_factor,2)}${read.cap_applied ? " · cap applied" : ""}. Human decision only.</p></div>
          <div class="risk-cell"><h4>Streak Reality · ${safe(read.season_bets)} bets</h4><table class="streak-table">${[3,5,7,10].map(n => `<tr><td>${n} losses</td><td>${pct(read.streaks[n].probability)} · ${num(read.streaks[n].expected_count,2)} expected</td></tr>`).join("")}</table><p class="subtle">${lossMajority}</p></div>
          <div class="risk-cell"><h4>Drawdown-Floor Risk</h4><div class="risk-hero ${read.ruin_warning ? "negative" : "positive"}">${pct(read.ruin_probability)}</div><p>Chance of touching ${pct(read.drawdown_floor)} of starting bankroll.</p>${read.ruin_warning ? `<p class="warning">Above ${pct(read.ruin_comfort_threshold)} comfort. Reduce to ${money(read.comfort_dollars)} (${pct(read.comfort_fraction)}).</p>` : '<p class="subtle">Within configured comfort threshold.</p>'}</div>
        </div></article>`;
    }

    function renderTriggers() {
      if (!ui.triggers.length) { $("triggerList").innerHTML = `<div class="empty">No triggers recorded</div>`; return; }
      $("triggerList").innerHTML = ui.triggers.map((row,index) => `<button class="trigger-row watch-game" data-trigger-index="${index}" type="button"><span class="subtle">${new Date(row.timestamp).toLocaleString()}</span><strong>${safe(row.favorite)} vs ${safe(row.dog)}</strong><span>D=${safe(row.threshold_crossed)}</span><span>${safe(row.fav_score)}-${safe(row.dog_score)}</span><span>Tier ${safe(row.tier_used || "—")}</span><span class="subtle">${safe(row.market_status || "NO_MARKET")}</span></button>`).join("");
      document.querySelectorAll("[data-trigger-index]").forEach(button => button.addEventListener("click", () => {
        const snapshot = ui.triggerSnapshots[Number(button.dataset.triggerIndex)];
        if (snapshot) { ui.selectedSnapshot = snapshot; ui.selectedGameId = snapshot.game_id; renderWatchList(); renderDetail(); $("detailSection").scrollIntoView({behavior:"smooth"}); }
      }));
    }

    $("configToggle").addEventListener("click", () => $("configPanel").classList.toggle("open"));
    $("configForm").addEventListener("submit", async event => {
      event.preventDefault(); const payload = {};
      new FormData(event.target).forEach((value,key) => payload[key] = Number(value));
      try { ui.config = await fetchJSON("/api/config", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)}); await refresh(); }
      catch (error) { alert(`Config not saved: ${error.message}`); }
    });
    refresh(); setInterval(refresh, 5000);
  </script>
</body>
</html>
