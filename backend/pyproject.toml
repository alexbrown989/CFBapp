[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Project metadata --------------------------------------------------------
# Private project; not intended for PyPI distribution.
[project]
name = "cfb-edge-journal-backend"
version = "0.1.0"
description = "CFB Live Edge Journal — backend (research-first; app code disabled until Phase 0 verdict)."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Alexander" }]

# All dependency pins were verified against pypi.org/pypi/<pkg>/json on
# 2026-05-06 per .cursorrules R21. Bump deliberately, not on autopilot.
dependencies = [
    # Web framework + ASGI server
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",

    # ORM (async) + drivers + migrations
    "sqlalchemy[asyncio]==2.0.49",
    "aiosqlite==0.22.1",
    "asyncpg==0.31.0",
    "alembic==1.18.4",

    # Validation + settings (Pydantic v2 per V5 rule 12)
    "pydantic==2.13.4",
    "pydantic-settings==2.14.0",

    # HTTP client for CFBD / Odds API / Open-Meteo
    "httpx==0.28.1",

    # Auth (Phase 2). PyJWT replaces python-jose per Owner addendum A.1.
    "PyJWT==2.12.1",
    "passlib[bcrypt]==1.7.4",

    # Config / scheduling / rate limiting
    "python-dotenv==1.2.2",
    "apscheduler==3.11.2",
    "slowapi==0.1.9",

    # Modeling / numerics (shared with research notebooks)
    "pandas==3.0.2",
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "black==26.3.1",
    "ruff==0.15.12",
    "mypy==2.0.0",
]
research = [
    "jupyter==1.1.1",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "xgboost==3.2.0",
]

# --- Hatch packaging ---------------------------------------------------------
# `app/` is the importable package; `tests/` is not packaged.
[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Black -------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# --- Ruff --------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Sensible defaults for a FastAPI + SQLAlchemy + Pydantic v2 service.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is enforced by black, not ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N806"] # test names sometimes need camelCase or capitals
"alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- MyPy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Third-party libraries without complete type stubs.
[[tool.mypy.overrides]]
module = ["passlib.*", "joblib.*", "apscheduler.*", "slowapi.*", "xgboost.*"]
ignore_missing_imports = true

# --- Pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
